name: CI

on:
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Using --legacy-peer-deps due to @types/node version conflict between vitest (requires 18+) and existing dependencies (requires 16)
        # TODO: Update @types/node to version 20+ to resolve peer dependency conflicts
        run: npm ci --no-progress --legacy-peer-deps

      - name: Run backend tests
        run: npm run test:backend

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build
        run: npm run build
