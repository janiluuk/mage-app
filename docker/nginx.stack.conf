# Nginx config for full stack (mage-api built from source listens on port 80)
events {}

http {
  upstream frontend {
    server app:8080;
  }

  upstream helper_api {
    server api:3000;
  }

  upstream mage_api {
    server mage-api-nginx:80;
  }

  server {
    listen 80;
    server_name gateway.localhost localhost;

    location /api/ {
      proxy_pass http://helper_api$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /mage-api/ {
      rewrite ^/mage-api/(.*)$ /$1 break;
      proxy_pass http://mage_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name app.localhost;

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name api.localhost;

    location / {
      proxy_pass http://helper_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 80;
    server_name mage-api.localhost;

    location / {
      proxy_pass http://mage_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
