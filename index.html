<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <link rel="icon" href="/favicon.ico">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Mage Beta</title>
    
      <link id="theme-css" rel="stylesheet" type="text/css" href="/themes/lara-dark-blue/theme.css">

  
    <!-- Font Awesome Icons -->
    <script type="text/javascript">
      (function() {      // Grab the link element by its ID
      const themeLink = document.getElementById("theme-css");

      // Check if the theme is saved in localStorage
      const savedTheme = localStorage.getItem("usertheme") ? JSON.parse(localStorage.getItem("usertheme")).theme : false;
      // If a theme is saved, use it; otherwise, use the default dark blue theme
      const themeToUse = savedTheme ? "/themes/"+ savedTheme + "/theme.css": "/themes/lara-dark-blue/theme.css";

      // Update the href attribute of the link element
      themeLink.setAttribute("href", themeToUse);

    })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  </head>
  
      <body class="dark dark-version">

      <div id="app"></div>
      <script type="module" src="/src/main.js"></script>
</body>

</html>
