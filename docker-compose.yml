version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mage-app
    hostname: app
    env_file:
      - .env.docker
    depends_on:
      - api
      - mage-api
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      mage:
        aliases:
          - app.localhost

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mage-app-test
    hostname: test
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    profiles:
      - test

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: mage-api-helper
    hostname: api
    env_file:
      - .env.docker
    environment:
      PORT: ${API_PORT:-3000}
      COMFY_HOST: ${COMFY_HOST:-ffmpeg-worker}
    depends_on:
      - ffmpeg-worker
    expose:
      - "3000"
    networks:
      mage:
        aliases:
          - api.localhost

  mage-api:
    image: ${MAGE_API_IMAGE:-ghcr.io/mage-ai/mage-api:latest}
    container_name: mage-api
    hostname: mage-api
    env_file:
      - .env.docker
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost/mage-api
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-mage}
      DB_USERNAME: ${MYSQL_USER:-mage}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      QUEUE_CONNECTION: sync
    depends_on:
      - mysql
    expose:
      - "47860"
    networks:
      mage:
        aliases:
          - mage-api.localhost

  mysql:
    image: mysql:8.0
    container_name: mage-mysql
    hostname: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mage}
      MYSQL_USER: ${MYSQL_USER:-mage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      mage:
        aliases:
          - mysql.localhost

  nginx:
    image: nginx:1.25
    container_name: mage-nginx
    hostname: gateway
    depends_on:
      - app
      - api
      - mage-api
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      mage:
        aliases:
          - gateway.localhost

  ffmpeg-worker:
    image: jrottenberg/ffmpeg:5.1-ubuntu
    command: ["sleep", "infinity"]
    networks:
      mage:
        aliases:
          - ffmpeg.localhost

  ollama:
    image: ollama/ollama:latest
    container_name: mage-ollama
    hostname: ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      mage:
        aliases:
          - ollama.localhost

networks:
  mage:
    driver: bridge

volumes:
  mysql_data:
  ollama_data:
